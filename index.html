<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MachineQLF — Tous mes liens</title>
<link rel="preload" as="image" href="bg-portrait.jpg" media="(max-aspect-ratio:1/1)">
<meta name="description" content="MachineQLF : live GTA 6 sur Twitch et Kick, clips sur TikTok, Instagram et YouTube.">
<meta property="og:title" content="MachineQLF — Tous mes liens">
<meta property="og:description" content="Live GTA 6 sur Twitch et Kick. Clips sur TikTok, Instagram et YouTube.">
<meta property="og:image" content="avatar.jpg">
<meta name="theme-color" content="#0F0C1A">
<link rel="icon" href="avatar.jpg">
<style>
@font-face{font-family:"Bowlby One";src:url(fonts/BowlbyOne.ttf) format("truetype");font-display:swap}
@font-face{font-family:"Big Shoulders";src:url(fonts/BigShouldersDisplay.ttf) format("truetype");font-weight:100 900;font-display:swap}
@font-face{font-family:"Josefin";src:url(fonts/JosefinSans.ttf) format("truetype");font-weight:100 700;font-display:swap}
:root{
  --ink:#200031;--night:#0F0C1A;--night2:#1A1530;--dusk:#2D2B4F;
  --sunset:linear-gradient(180deg,#4852C7 0%,#8544C3 16%,#CB3ABF 32%,#F44EA3 48%,#FE6C8D 62%,#FE7C6D 74%,#FE8D55 86%,#FDA351 100%);
  --ease:cubic-bezier(.32,.72,0,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  background:var(--night);color:#fff;font-family:"Josefin",system-ui,sans-serif;
  display:flex;justify-content:center;overflow-x:hidden;
}
/* décor : image fixe du ciel de nuit (version allégée ; l'ancienne version animée est dans index-anime.html) */
#bg{position:fixed;inset:0;z-index:0;background:#0F0C1A url(bg-portrait.jpg) center/cover no-repeat}
@media (min-aspect-ratio:1/1){#bg{background-image:url(bg-paysage.jpg)}}
main{position:relative;z-index:2;width:100%;max-width:460px;padding:36px 20px 64px;display:flex;flex-direction:column;align-items:center;gap:18px}
.avatar{width:128px;height:128px;border-radius:50%;padding:4px;background:var(--sunset);box-shadow:0 0 0 3px var(--ink),0 0 34px rgba(244,78,163,.7)}
.avatar img{width:100%;height:100%;border-radius:50%;display:block;object-fit:cover;border:3px solid var(--ink)}
.logo{width:min(100%,330px);height:auto;margin-top:2px;filter:drop-shadow(0 6px 0 rgba(32,0,49,.6))}
.kicker{font-weight:700;text-transform:uppercase;letter-spacing:.22em;font-size:.78rem;color:#FFE3B5;text-align:center}
.kicker b{color:#FFB2C6}

.live{width:100%;display:flex;flex-direction:column;gap:12px;margin-top:6px}
.sep{width:100%;display:flex;align-items:center;gap:10px;margin-top:10px;font-weight:700;text-transform:uppercase;letter-spacing:.22em;font-size:.72rem;color:#CCC2F5}
.sep::before,.sep::after{content:"";flex:1;height:2px;background:linear-gradient(90deg,transparent,#F44EA3,transparent)}

a.btn{position:relative;display:flex;align-items:center;gap:14px;width:100%;text-decoration:none;color:#fff;
  border-radius:18px;padding:14px 18px;border:3px solid var(--ink);
  background:rgba(26,21,48,.9);
  box-shadow:0 5px 0 var(--ink),0 0 0 1px rgba(255,178,198,.25) inset;
  transition:transform .25s var(--ease),box-shadow .25s var(--ease)}
a.btn:hover,a.btn:focus-visible{transform:translateY(-3px);box-shadow:0 8px 0 var(--ink),0 0 26px rgba(244,78,163,.55)}
a.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--ink)}
a.btn:focus-visible{outline:3px solid #FFAD36;outline-offset:3px}
.ico{flex:none;width:46px;height:46px;border-radius:13px;display:grid;place-items:center;border:2px solid var(--ink)}
.ico svg{width:26px;height:26px;fill:#fff}
.txt{flex:1;min-width:0}.name,.sub{display:block}
.name{font-family:"Big Shoulders","Josefin",sans-serif;font-weight:900;text-transform:uppercase;font-size:1.55rem;line-height:1;letter-spacing:.02em}
.sub{font-size:.86rem;color:#E5DDFF;margin-top:3px}
.arrow{flex:none;font-family:"Bowlby One";font-size:1.1rem;color:#FFB2C6}

/* les deux lives en grand, dégradé coucher de soleil */
a.btn.big{padding:18px 18px;background:var(--sunset);box-shadow:0 6px 0 var(--ink),0 0 30px rgba(244,78,163,.45)}
a.btn.big .name{font-size:1.9rem;color:#fff;-webkit-text-stroke:1.2px var(--ink);paint-order:stroke fill;text-shadow:0 3px 0 var(--ink)}
a.btn.big .sub{color:#fff;font-weight:700;text-shadow:0 1px 0 var(--ink)}
a.btn.big .arrow{color:#fff;text-shadow:0 2px 0 var(--ink)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#ff2e5b;box-shadow:0 0 0 2px var(--ink);margin-right:6px;vertical-align:1px;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.35}}

.i-twitch{background:#9146FF}.i-kick{background:#53FC18}.i-kick svg{fill:#0F0C1A}
.i-tiktok{background:#0F0C1A}.i-insta{background:radial-gradient(circle at 30% 107%,#fdf497 0,#fd5949 45%,#d6249f 60%,#285AEB 90%)}.i-yt{background:#FF0033}

.cta{width:100%;text-align:center;margin:14px 0 2px;padding:14px 12px;border-radius:18px;border:3px solid var(--ink);
  background:rgba(15,12,26,.78);box-shadow:0 0 24px rgba(244,78,163,.35)}
.cta-k{font-weight:700;text-transform:uppercase;letter-spacing:.22em;font-size:.72rem;color:#FFB2C6}
.cta-t{font-family:"Bowlby One",sans-serif;font-size:1.55rem;line-height:1.15;margin-top:6px;
  background:linear-gradient(180deg,#FFE3B5 0%,#FE8D55 45%,#F44EA3 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 0 var(--ink))}
.cta-s{font-size:.85rem;color:#E5DDFF;margin-top:6px}
footer{margin-top:18px;font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:#CCC2F5;text-align:center;opacity:.8}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="bg" aria-hidden="true"></div>

<main>
  <div class="avatar"><img src="avatar.jpg" alt="Avatar de MachineQLF" width="128" height="128"></div>
  <img class="logo" src="logo.png" alt="MachineQLF" width="330" height="111">
  <p class="kicker">Live <b>GTA 6</b> · Gaming · Bonne humeur</p>

  <div class="live">
    <a class="btn big" href="https://www.twitch.tv/machineqlf" target="_blank" rel="noopener">
      <span class="ico i-twitch"><svg viewBox="0 0 24 24"><path d="M4.3 2 3 5.4v13.8h4.7V22h2.6l2.8-2.8h3.8L22 14.1V2zm16 11.2-3 3h-4.7l-2.6 2.6v-2.6H6V3.7h14.3zM17.3 7v5.2h-1.7V7zm-4.7 0v5.2h-1.7V7z"/></svg></span>

    </a>
    <a class="btn big" href="https://kick.com/machineqlf" target="_blank" rel="noopener">
      <span class="ico i-kick"><svg viewBox="0 0 24 24"><path d="M3 2h6v5h2V5h2V3h2V2h6v6h-2v2h-2v4h2v2h2v6h-6v-1h-2v-2h-2v-2H9v5H3z"/></svg></span>

  <div class="cta">

    <p class="cta-s">Un abonnement, un like, un partage : ça m'aide énormément</p>
  </div>

  <a class="btn" href="https://www.instagram.com/machineqlf_/" target="_blank" rel="noopener">

    <span class="txt"><span class="name">Instagram</span><span class="sub">@machineqlf_</span></span>
    <span class="arrow">→</span>
  </a>
  <a class="btn" href="https://www.tiktok.com/@machineqlf" target="_blank" rel="noopener">
    <span class="ico i-tiktok"><svg viewBox="0 0 24 24"><path d="M16.6 2h-3.4v13.3a2.9 2.9 0 1 1-2.1-2.8V9a6.3 6.3 0 1 0 5.5 6.3V8.6a8 8 0 0 0 4.4 1.4V6.6a4.5 4.5 0 0 1-4.4-4.6z"/></svg></span>
    <span class="txt"><span class="name">TikTok</span><span class="sub">@machineqlf</span></span>
    <span class="arrow">→</span>
  </a>
  <a class="btn" href="https://www.youtube.com/@MachineQLF_tv" target="_blank" rel="noopener">
    <span class="ico i-yt"><svg viewBox="0 0 24 24"><path d="M23 7.2a3 3 0 0 0-2.1-2.1C19 4.6 12 4.6 12 4.6s-7 0-8.9.5A3 3 0 0 0 1 7.2 31 31 0 0 0 .5 12a31 31 0 0 0 .5 4.8 3 3 0 0 0 2.1 2.1c1.9.5 8.9.5 8.9.5s7 0 8.9-.5a3 3 0 0 0 2.1-2.1 31 31 0 0 0 .5-4.8 31 31 0 0 0-.5-4.8zM9.7 15V9l5.9 3z"/></svg></span>

  <footer>© MachineQLF</footer>
</main>
</body>
</html>
