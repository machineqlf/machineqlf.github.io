:root{

  --sunset:linear-gradient(180deg,#4852C7 0%,#8544C3 16%,#CB3ABF 32%,#F44EA3 48%,#FE6C8D 62%,#FE7C6D 74%,#FE8D55 86%,#FDA351 100%);

}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  background:var(--night);color:#fff;font-family:"Josefin",system-ui,sans-serif;

.logo{width:min(100%,330px);height:auto;margin-top:2px;filter:drop-shadow(0 6px 0 rgba(32,0,49,.6))}
.kicker{font-weight:700;text-transform:uppercase;letter-spacing:.22em;font-size:.78rem;color:#FFE3B5;text-align:center}
.kicker b{color:#FFB2C6}

.live{width:100%;display:flex;flex-direction:column;gap:12px;margin-top:6px}
.sep{width:100%;display:flex;align-items:center;gap:10px;margin-top:10px;font-weight:700;text-transform:uppercase;letter-spacing:.22em;font-size:.72rem;color:#CCC2F5}
.sep::before,.sep::after{content:"";flex:1;height:2px;background:linear-gradient(90deg,transparent,#F44EA3,transparent)}

a.btn{position:relative;display:flex;align-items:center;gap:14px;width:100%;text-decoration:none;color:#fff;
  border-radius:18px;padding:14px 18px;border:3px solid var(--ink);
  background:rgba(26,21,48,.78);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  box-shadow:0 5px 0 var(--ink),0 0 0 1px rgba(255,178,198,.25) inset;
  transition:transform .25s var(--ease),box-shadow .25s var(--ease)}
a.btn:hover,a.btn:focus-visible{transform:translateY(-3px);box-shadow:0 8px 0 var(--ink),0 0 26px rgba(244,78,163,.55)}
a.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--ink)}
a.btn:focus-visible{outline:3px solid #FFAD36;outline-offset:3px}
.ico{flex:none;width:46px;height:46px;border-radius:13px;display:grid;place-items:center;border:2px solid var(--ink)}
.ico svg{width:26px;height:26px;fill:#fff}
.txt{flex:1;min-width:0}.name,.sub{display:block}
.name{font-family:"Big Shoulders","Josefin",sans-serif;font-weight:900;text-transform:uppercase;font-size:1.55rem;line-height:1;letter-spacing:.02em}
.sub{font-size:.86rem;color:#E5DDFF;margin-top:3px}
.arrow{flex:none;font-family:"Bowlby One";font-size:1.1rem;color:#FFB2C6}

/* les deux lives en grand, dégradé coucher de soleil */
a.btn.big{padding:18px 18px;background:var(--sunset);box-shadow:0 6px 0 var(--ink),0 0 30px rgba(244,78,163,.45)}
a.btn.big .name{font-size:1.9rem;color:#fff;-webkit-text-stroke:1.2px var(--ink);paint-order:stroke fill;text-shadow:0 3px 0 var(--ink)}
a.btn.big .sub{color:#fff;font-weight:700;text-shadow:0 1px 0 var(--ink)}
a.btn.big .arrow{color:#fff;text-shadow:0 2px 0 var(--ink)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#ff2e5b;box-shadow:0 0 0 2px var(--ink);margin-right:6px;vertical-align:1px;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.35}}

.i-twitch{background:#9146FF}.i-kick{background:#53FC18}.i-kick svg{fill:#0F0C1A}
.i-tiktok{background:#0F0C1A}.i-insta{background:radial-gradient(circle at 30% 107%,#fdf497 0,#fd5949 45%,#d6249f 60%,#285AEB 90%)}.i-yt{background:#FF0033}

footer{margin-top:18px;font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:#CCC2F5;text-align:center;opacity:.8}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
// MachineQLF « Vice » : procedural palm trees (our own drawing code, no image copied).
// Each frond is a drooping rachis with hundreds of ragged leaflets, like a real coconut palm silhouette.
// PALMS.tree(opts) -> SVG <g> markup in a 1000 x 1600 box (crown near the top, trunk base at the bottom).
(function(){
  function rng(seed){let s=seed>>>0||1;return()=>{s^=s<<13;s^=s>>>17;s^=s<<5;return((s>>>0)%100000)/100000}}
  const P={};
  // one frond: start (x,y), initial angle (rad, 0 = right, -PI/2 = up), length, droop strength, side bias
  function frond(r,x,y,ang,len,droop,o){
    // a frond leaves the crown at angle ang, then gravity bends it down: an arch, never a spiral
    const steps=48, pts=[]; let px=x, py=y; const ds=len/steps;
    const target=Math.PI/2*(Math.cos(ang)>=0?1:1);            // straight down
    for(let i=0;i<=steps;i++){const k=i/steps;
      // blend the heading toward "down" (shortest way), more and more along the frond
      let diff=target-ang; while(diff>Math.PI)diff-=2*Math.PI; while(diff<-Math.PI)diff+=2*Math.PI;
      const a=ang+diff*Math.min(1,droop*Math.pow(k,1.7));
      pts.push([px,py,a]); px+=Math.cos(a)*ds; py+=Math.sin(a)*ds}
    const w0=o.rib||7; let L='',R='';
    pts.forEach((p,i)=>{const k=i/steps,w=w0*(1-k)+0.6,nx=-Math.sin(p[2]),ny=Math.cos(p[2]);
      L+=(i?'L':'M')+(p[0]+nx*w).toFixed(1)+' '+(p[1]+ny*w).toFixed(1);R=`L${(p[0]-nx*w).toFixed(1)} ${(p[1]-ny*w).toFixed(1)}`+R});
    let d=L+R+'Z';
    for(let i=2;i<steps;i++){
      const k=i/steps, p=pts[i]; if(r()<o.gap) continue;
      for(const side of [-1,1]){
        if(r()<o.gap*0.5) continue;
        const base=len*o.leaf*Math.pow(Math.sin(Math.PI*Math.min(1,k*1.1+0.04)),0.7)*(0.7+0.55*r());
        // leaflet leaves the rib forward-ish, then hangs toward the ground
        let la=p[2]+side*(0.75+0.45*r());
        let diff=Math.PI/2-la; while(diff>Math.PI)diff-=2*Math.PI; while(diff<-Math.PI)diff+=2*Math.PI;
        la+=diff*(0.35+0.3*r())*o.hang;
        const lw=(o.lw||4.5)*(0.7+0.6*r())*(1-0.45*k);
        let d2=Math.PI/2-la; while(d2>Math.PI)d2-=2*Math.PI; while(d2<-Math.PI)d2+=2*Math.PI;
        const bend=d2*0.35+(r()-0.5)*0.25;                    // tip curls down a bit more
        const mx=p[0]+Math.cos(la)*base*0.55, my=p[1]+Math.sin(la)*base*0.55;
        const ex=p[0]+Math.cos(la+bend)*base, ey=p[1]+Math.sin(la+bend)*base;
        const nx=-Math.sin(la)*lw, ny=Math.cos(la)*lw;
        d+=`M${(p[0]+nx).toFixed(1)} ${(p[1]+ny).toFixed(1)}Q${(mx+nx).toFixed(1)} ${(my+ny).toFixed(1)} ${ex.toFixed(1)} ${ey.toFixed(1)}Q${(mx-nx*.6).toFixed(1)} ${(my-ny*.6).toFixed(1)} ${(p[0]-nx).toFixed(1)} ${(p[1]-ny).toFixed(1)}Z`;
      }
    }
    return d;
  }
  P.tree=function(o={}){
    const r=rng(o.seed||1), W=1000, H=1600;
    const fill=o.fill||'#3b1a4a';
    // trunk: gentle S curve from the base to the crown, tapered, with ring notches
    const bx=o.baseX??500, by=H, cx=bx+(o.lean??(r()-0.5)*260), cy=o.crownY??330;
    const c1x=bx+(cx-bx)*0.15+(r()-0.5)*80, c1y=by-(by-cy)*0.45;
    const seg=60; let L='',R='';
    for(let i=0;i<=seg;i++){const t=i/seg;
      const x=(1-t)*(1-t)*bx+2*(1-t)*t*c1x+t*t*cx, y=(1-t)*(1-t)*by+2*(1-t)*t*c1y+t*t*cy;
      const dx=2*(1-t)*(c1x-bx)+2*t*(cx-c1x), dy=2*(1-t)*(c1y-by)+2*t*(cy-c1y), n=Math.hypot(dx,dy);
      const nx=-dy/n, ny=dx/n; let w=(o.trunk||26)*(1-0.45*t)*(1+(i%3==0?0.07:0)); if(i<3) w*=1.25;
      L+=(i?'L':'M')+(x+nx*w).toFixed(1)+' '+(y+ny*w).toFixed(1); R=`L${(x-nx*w).toFixed(1)} ${(y-ny*w).toFixed(1)}`+R}
    let d=L+R+'Z';
    // crown: fronds fanned all around, more of them sideways, a few hanging dead ones
    const n=o.fronds||13;
    for(let i=0;i<n;i++){
      const base=-Math.PI/2+(i/(n-1)-0.5)*Math.PI*(o.spread??1.75)+(r()-0.5)*0.3;
      const len=(o.size||600)*(0.7+0.4*r())*(Math.abs(Math.cos(base))*0.45+0.7);
      d+=frond(r,cx+(r()-0.5)*14,cy+(r()-0.5)*10,base,len,(o.droop??0.75)+r()*0.45,{leaf:o.leaf||0.34,gap:o.gap??0.12,hang:o.hang??1,lw:o.lw,rib:o.rib});
    }
    for(let i=0;i<(o.dead??3);i++){const a=(r()<.5?0.25:Math.PI-0.25)+(r()-0.5)*0.5;d+=frond(r,cx,cy+8,a,(o.size||520)*0.5*(0.7+0.5*r()),1,{leaf:0.18,gap:0.35,hang:1.2,lw:3,rib:4})}
    // coconuts
    for(let i=0;i<(o.nuts??4);i++){const a=r()*Math.PI;d+=`M${cx+Math.cos(a)*22+12} ${cy+24+r()*14}a13 13 0 1 0 .1 0Z`}
    return `<path d="${d}" fill="${fill}" fill-rule="nonzero"/>`;
  };
  // a full SVG with one palm, positioned and scaled: PALMS.svg({seed, h, fill, flip, opacity, blur})
  P.svg=function(o={}){const h=o.h||800, w=h*1000/1600;
    return `<svg viewBox="0 0 1000 1600" width="${w}" height="${h}" style="display:block;overflow:visible;${o.flip?'transform:scaleX(-1);':''}${o.blur?`filter:blur(${o.blur}px);`:''}opacity:${o.opacity??1}">${P.tree(o)}</svg>`};
  window.PALMS=P;
})();


(function(){
  const portrait=innerHeight>innerWidth, W=portrait?1080:1920, H=portrait?1920:1080;
  const st=document.getElementById('stage'); st.style.width=W+'px'; st.style.height=H+'px';
  st.innerHTML=`<div style="position:absolute;inset:0;background:linear-gradient(180deg,#0F0C1A 0%,#1A1530 30%,#2D2B4F 55%,#4B2F54 75%,#8a4a6e 92%,#c86a78 100%)"></div>
   <canvas id="sk-stars" style="position:absolute;left:0;top:0"></canvas>
   <div style="position:absolute;left:50%;width:1500px;height:1500px;margin-left:-750px;top:${H*0.80-750}px;border-radius:50%;background:radial-gradient(circle,rgba(254,108,141,.55),rgba(203,58,191,.20) 35%,transparent 65%)"></div>
   <div id="sun" style="position:absolute;left:50%;border-radius:50%"></div>
   <canvas id="sk-cl" style="position:absolute;left:0;top:0"></canvas>
   <div id="sk-far" style="position:absolute;inset:0"></div>
   <div style="position:absolute;left:0;right:0;bottom:0;height:34%;background:linear-gradient(transparent,rgba(75,47,84,.55) 60%,rgba(42,24,64,.85))"></div>
   <div id="sk-mid" style="position:absolute;inset:0"></div><div id="sk-near" style="position:absolute;inset:0"></div>`;
  const D=portrait?620:560, sun=document.getElementById('sun');
  sun.style.cssText+=`width:${D}px;height:${D}px;margin-left:${-D/2}px;top:${H*0.80-D*0.62}px;
    background:linear-gradient(180deg,#FFE3B5 0%,#FDA351 22%,#FE8D55 40%,#FE6C8D 62%,#F44EA3 80%,#CB3ABF 100%);
    box-shadow:0 0 90px 30px rgba(254,108,141,.45),0 0 220px 80px rgba(203,58,191,.25);
    -webkit-mask:linear-gradient(180deg,#000 72%,transparent 92%);mask:linear-gradient(180deg,#000 72%,transparent 92%)`;
  let s=11;const R=()=>{s=(s*16807)%2147483647;return s/2147483647};
  const sc=document.getElementById('sk-stars');sc.width=W;sc.height=H;const sg=sc.getContext('2d');
  const stars=[...Array(portrait?190:160)].map(()=>({x:R()*W,y:R()*H*0.62,r:.6+R()*1.7,p:R()*6}));
  const cl=document.getElementById('sk-cl');cl.width=W*2;cl.height=H;const g=cl.getContext('2d');
  for(let i=0;i<60;i++){const y=H*(0.2+R()*0.55),x=R()*W*2,w=W*(0.25+R()*0.6),hh=8+R()*30;const warm=y/H;
    g.save();g.filter=`blur(${10+R()*18}px)`;g.globalAlpha=0.05+R()*0.12;g.fillStyle=warm>0.55?'#FE6C8D':'#8544C3';
    g.beginPath();g.ellipse(x,y,w/2,hh/2,(R()-0.5)*0.06,0,Math.PI*2);g.fill();g.restore()}
  const C=h=>h*0.3125;
  const P=(seed,h,fill,x,flip,op,ex={})=>`<div class="pt" style="position:absolute;left:${x}px;bottom:${ex.b||0}px;transform-origin:50% 100%">${PALMS.svg(Object.assign({seed,h,fill,flip,opacity:op},ex))}</div>`;
  const cols=['#3a2450','#2a1840','#160d26'];
  const far=portrait?[[5,820,240],[8,700,560],[14,760,860]]:[[5,560,460],[8,500,980],[14,540,1280],[21,480,1520]];
  const mid=portrait?[[31,1150,60,0],[44,1050,1040,1]]:[[31,880,160,0],[44,800,1660,1]];
  const near=portrait?[[57,1750,-200,0],[63,1650,1280,1]]:[[57,1250,-160,0],[63,1150,2020,1]];
  document.getElementById('sk-far').innerHTML=far.map(([sd,h,x],i)=>P(sd,h,cols[0],x-C(h),i%2,.55)).join('');
  document.getElementById('sk-mid').innerHTML=mid.map(([sd,h,x,f])=>P(sd,h,cols[1],x-C(h),f,.85,{b:-20})).join('');
  document.getElementById('sk-near').innerHTML=near.map(([sd,h,x,f])=>P(sd,h,cols[2],x-C(h),f,.95,{size:700,b:-60})).join('');
  const pts=[...st.querySelectorAll('.pt')];
  const SR=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)};
  function shooting(t){const slot=Math.floor(t/5);
    for(const k of [slot-1,slot]){ if(k<0||SR(k*3.1)>0.6)continue;
      const t0=k*5+SR(k*7.7)*3.8, d=1.0, p=(t-t0)/d; if(p<0||p>1)continue;
      const x0=W*(0.1+SR(k*1.3)*0.7), y0=H*(0.04+SR(k*5.9)*0.3), ang=(18+SR(k*2.2)*22)*Math.PI/180, dir=SR(k*9.1)<0.5?1:-1;
      const L=W*0.24, hx=x0+dir*Math.cos(ang)*L*p*1.6, hy=y0+Math.sin(ang)*L*p*1.6, tl=L*0.45*Math.sin(Math.PI*Math.min(1,p*1.4));
      const tx=hx-dir*Math.cos(ang)*tl, ty=hy-Math.sin(ang)*tl, a=Math.sin(Math.PI*p);
      const gr=sg.createLinearGradient(tx,ty,hx,hy);gr.addColorStop(0,'rgba(255,227,181,0)');gr.addColorStop(1,`rgba(255,240,220,${a})`);
      sg.globalAlpha=1;sg.strokeStyle=gr;sg.lineWidth=2.6;sg.lineCap='round';sg.beginPath();sg.moveTo(tx,ty);sg.lineTo(hx,hy);sg.stroke();
      sg.fillStyle=`rgba(255,250,240,${a})`;sg.beginPath();sg.arc(hx,hy,2.8,0,Math.PI*2);sg.fill();}}
  function fit(){const k=Math.max(innerWidth/W,innerHeight/H);st.style.transform=`translate(-50%,-50%) scale(${k})`}
  fit();addEventListener('resize',fit);
  const still=matchMedia('(prefers-reduced-motion: reduce)').matches;
  function frame(t){
    cl.style.transform=`translateX(${-(t*14)%W}px)`;
    sg.clearRect(0,0,W,H);stars.forEach(o=>{sg.globalAlpha=.35+.65*Math.abs(Math.sin(t*.8+o.p));sg.fillStyle='#FFE3B5';sg.beginPath();sg.arc(o.x,o.y,o.r,0,Math.PI*2);sg.fill()});
    shooting(t);
    pts.forEach((p,i)=>{p.style.transform=`rotate(${Math.sin(t*0.8+i*1.7)*(0.6+0.3*(i%3))}deg)`});
  }
  const fixed=new URLSearchParams(location.search).get('t');
  if(still||fixed!==null){frame(+(fixed||2));return}
  const t0=performance.now();(function f(){frame((performance.now()-t0)/1000);requestAnimationFrame(f)})();
})();
